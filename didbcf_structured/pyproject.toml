[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "didbcf-structured"
version = "0.1.0"
description = "Bayesian causal forests for difference-in-differences with an identified, two-way restricted prognostic function"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.23",
    "pandas>=1.5",
    "stochtree>=0.4",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools]
packages = ["didbcf_structured"]
package-dir = { "didbcf_structured" = "." }
